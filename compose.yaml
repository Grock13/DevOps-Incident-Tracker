name: incident-stack

services:

  db:
    image: postgres:17-alpine
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    volumes:
      - incident_pgdata:/var/lib/postgresql/data

    networks:
      - incident-net

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .

    image: incident-api:day5
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - incident-net

    # Security hardening
    read_only: true

    tmpfs:
      - /tmp:rw,nosuid,size=32m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    # Resource limits
    mem_limit: 256m
    cpus: 0.75

secrets:
  db_password:
    file: ./secrets/db_password

networks:
  incident-net:
    external: true

volumes:
  incident_pgdata:
    external: true
