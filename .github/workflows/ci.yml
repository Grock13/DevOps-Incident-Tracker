name: Incident API - CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  basic-checks:
    name: Python and Bash validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile app/main.py

      - name: Check Bash syntax
        run: bash -n scripts/smoke-test.sh

      - name: Verify essential files
        run: |
          test -f Dockerfile
          test -f compose.yaml
          test -f requirements.txt
          test -f requirements-dev.txt
          echo "Required files present."

  integration-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    needs: basic-checks

    env:
      POSTGRES_USER: incident_user
      POSTGRES_DB: incidents_ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: incident_user
          POSTGRES_PASSWORD: ci-only-integration-password
          POSTGRES_DB: incidents_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U incident_user -d incidents_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Create temporary CI password file
        run: |
          umask 077
          printf '%s' 'ci-only-integration-password' \
            > "$RUNNER_TEMP/incident-ci-password"

          echo "POSTGRES_PASSWORD_FILE=$RUNNER_TEMP/incident-ci-password" \
            >> "$GITHUB_ENV"

      - name: Run integration tests
        run: python -m pytest -q

  docker-build:
    name: Build and verify Docker image
    runs-on: ubuntu-24.04

    needs: integration-tests

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: incident-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect Docker image
        run: |
          docker image ls incident-api
          docker image inspect incident-api:ci \
            --format 'Image size: {{.Size}} bytes'
          docker image inspect incident-api:ci \
            --format 'Container user: {{.Config.User}}'

      - name: Verify non-root configuration
        run: |
          test "$(docker image inspect \
            -f '{{.Config.User}}' incident-api:ci)" = "appuser"

          echo "PASS: Application configured as non-root"

      - name: Verify Python dependencies
        run: |
          docker run --rm \
            --entrypoint python \
            incident-api:ci \
            -c "import fastapi, sqlalchemy, psycopg; print('Dependencies installed successfully')"

      - name: Verify application files
        run: |
          docker run --rm \
            --entrypoint python \
            incident-api:ci \
            -c "from pathlib import Path; assert Path('/app/app/main.py').is_file(); print('Application file found')"
